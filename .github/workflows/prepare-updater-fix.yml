name: Prepare Clearlist release
on:
  push:
    branches: [prepare-updater-build-fix]
    paths: ['.github/workflows/prepare-updater-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release commit with project attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/git/commits', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({"message":"Release 0.1.4 with task selection and theme-aware controls","tree":"e38fe647c8daf8606efac04f3003a5edc329380d","parents":["c7b65b19c5c86bfb1e3580858c151b89d686dc2e"],"author":{"name":"Clearlist contributors","email":"noreply@clearlist.invalid","date":"2026-09-22T07:22:11-03:00"},"committer":{"name":"Clearlist contributors","email":"noreply@clearlist.invalid","date":"2026-09-22T07:22:11-03:00"}})
          });
          if (!response.ok) throw new Error('Commit creation failed: ' + response.status + ' ' + await response.text());
          console.log('Prepared release commit: ' + (await response.json()).sha);
          NODE
