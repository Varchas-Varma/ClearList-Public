name: Prepare Clearlist release
on:
  push:
    branches: [prepare-updater-build-fix]
    paths: ['.github/workflows/prepare-updater-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release commit with project attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/git/commits', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({"message":"Add universal macOS installer and desktop update publishing","tree":"d27049940d3d00e79130722ebdd9152b55e38851","parents":["74674e8eac9eb362c819038385126bc5592d1cbe"],"author":{"name":"Clearlist contributors","email":"noreply@clearlist.invalid","date":"2026-09-22T15:50:08-06:00"},"committer":{"name":"Clearlist contributors","email":"noreply@clearlist.invalid","date":"2026-09-22T15:50:08-06:00"}})
          });
          if (!response.ok) throw new Error('Commit creation failed: ' + response.status + ' ' + await response.text());
          console.log('Prepared release commit: ' + (await response.json()).sha);
          NODE
