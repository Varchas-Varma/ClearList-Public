name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master, clearlist-build]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify upgrade and hierarchy moves
        run: cargo test --release -p clearlist-core --test hierarchy

      - name: Make installer available for download
        uses: actions/upload-artifact@v7
        with:
          name: Clearlist-0.1.1-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
