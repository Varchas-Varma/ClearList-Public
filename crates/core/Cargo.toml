[package]
name = "clearlist-core"
version = "0.1.4"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
